name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # Zero dependencies: no install step. Includes the path/link checks (test/links.test.mjs).
      - run: node --test test/*.test.mjs

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # Runs without Claude credentials (checked locally with an empty HOME and no API key).
      - run: npx -y @anthropic-ai/claude-code plugin validate . --strict
      - run: npx -y @anthropic-ai/claude-code plugin validate .claude-plugin/plugin.json --strict
