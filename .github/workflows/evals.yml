name: evals

# Skill-triggering evals call the model and cost money, so they run only on demand
# and only when the ANTHROPIC_API_KEY secret is set.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per case per arm
        default: '3'
      threshold:
        description: Minimum case score (0..1)
        default: '0.8'

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Run evals
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: |
          npx -y @anthropic-ai/claude-code plugin eval . \
            --trust-plugin \
            --json evals-result.json \
            --runs "${{ inputs.runs }}" \
            --threshold "${{ inputs.threshold }}" \
            --model claude-sonnet-5-5 \
            --no-publish \
            --max-cost-usd 20
      - name: Skip (no API key)
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: echo "ANTHROPIC_API_KEY secret is not set; evals skipped."
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evals-result
          path: |
            evals-result.json
            evals/results/
          if-no-files-found: ignore
